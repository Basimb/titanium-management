name: Deploy to InMotion

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: titanium-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Package standalone release
        run: |
          mkdir -p release/.next/static release/public
          cp -a .next/standalone/. release/
          cp -a .next/static/. release/.next/static/
          cp -a public/. release/public/
          tar -czf titanium-release.tar.gz -C release .

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.INMOTION_SSH_KEY }}
          INMOTION_HOST: ${{ secrets.INMOTION_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/inmotion
          chmod 600 ~/.ssh/inmotion
          ssh-keyscan -H "$INMOTION_HOST" >> ~/.ssh/known_hosts

      - name: Upload release
        env:
          INMOTION_HOST: ${{ secrets.INMOTION_HOST }}
          INMOTION_USER: ${{ secrets.INMOTION_USER }}
        run: |
          scp -i ~/.ssh/inmotion titanium-release.tar.gz "$INMOTION_USER@$INMOTION_HOST:/home/$INMOTION_USER/titanium-release.tar.gz"

      - name: Activate release
        env:
          INMOTION_HOST: ${{ secrets.INMOTION_HOST }}
          INMOTION_USER: ${{ secrets.INMOTION_USER }}
        run: |
          ssh -i ~/.ssh/inmotion "$INMOTION_USER@$INMOTION_HOST" 'set -eu
            APP=/home/'"$INMOTION_USER"'/management.titanium-pharmacy.com
            STAGE=/home/'"$INMOTION_USER"'/titanium-release-stage
            rm -rf "$STAGE"
            mkdir -p "$STAGE"
            tar -xzf /home/'"$INMOTION_USER"'/titanium-release.tar.gz -C "$STAGE"
            cp -a "$STAGE"/. "$APP"/
            mkdir -p "$APP/tmp"
            touch "$APP/tmp/restart.txt"
            rm -rf "$STAGE"
            rm -f /home/'"$INMOTION_USER"'/titanium-release.tar.gz'
